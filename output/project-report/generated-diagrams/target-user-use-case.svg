  <g>
    <rect x="54" y="820" width="1180" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
    <text x="78" y="852" class="note">职责与分工说明：</text>
    <text x="78" y="882" class="small">普通用户负责个人学习闭环，是核心高频角色；管理员负责基础数据、用户、日志和运行维护；AI 服务只提供辅助分析，不替代用户决策。</text>
