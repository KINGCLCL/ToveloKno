<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,5 L0,10 Z" fill="#202124"/>
    </marker>
    <marker id="softArrow" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,5 L0,10 Z" fill="#5f6c7b"/>
    </marker>
    <style>
      .title { font: 700 36px "SimSun", "Microsoft YaHei", sans-serif; fill: #111827; }
      .sub { font: 20px "SimSun", "Microsoft YaHei", sans-serif; fill: #4b5563; }
      .actor { font: 700 26px "SimSun", "Microsoft YaHei", sans-serif; fill: #111827; }
      .actorSub { font: 18px "SimSun", "Microsoft YaHei", sans-serif; fill: #4b5563; }
      .case { font: 21px "SimSun", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 17px "SimSun", "Microsoft YaHei", sans-serif; fill: #4b5563; }
      .note { font: 18px "SimSun", "Microsoft YaHei", sans-serif; fill: #374151; }
      .panel { fill: #fbfdff; stroke: #1f2937; stroke-width: 2.5; }
      .caseOval { fill: #f7fbff; stroke: #1f2937; stroke-width: 2.2; }
      .caseOvalAlt { fill: #fff7ed; stroke: #1f2937; stroke-width: 2.2; }
      .caseOvalGreen { fill: #effcf6; stroke: #1f2937; stroke-width: 2.2; }
      .caseOvalPink { fill: #fff4fa; stroke: #1f2937; stroke-width: 2.2; }
      .line { fill: none; stroke: #202124; stroke-width: 2.4; marker-end: url(#arrow); }
      .relation { fill: none; stroke: #5f6c7b; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#softArrow); }
    </style>
  </defs>

  <rect width="1500" height="980" fill="#ffffff"/>
  <text x="54" y="66" class="title">ToveloKno 目标用户用例图</text>
  <text x="54" y="104" class="sub">面向学生的智能学习资源管理与复习平台：资料导入、题库练习、错题复盘、计划跟踪、社区分享与 AI 辅助。</text>

  <rect x="285" y="145" width="925" height="720" rx="10" class="panel"/>
  <text x="665" y="185" class="actor">系统边界：ToveloKno</text>

  <g transform="translate(72 230)">
    <circle cx="78" cy="25" r="23" fill="#eef5ff" stroke="#111827" stroke-width="2.5"/>
    <path d="M78 48 L78 118 M34 76 L122 76 M78 118 L38 176 M78 118 L118 176" stroke="#111827" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text x="78" y="222" text-anchor="middle" class="actor">普通用户（学生）</text>
    <text x="78" y="252" text-anchor="middle" class="actorSub">高频使用：每日 / 每周</text>
  </g>

  <g transform="translate(1282 250)">
    <circle cx="72" cy="25" r="23" fill="#fff7ed" stroke="#111827" stroke-width="2.5"/>
    <path d="M72 48 L72 118 M28 76 L116 76 M72 118 L32 176 M72 118 L112 176" stroke="#111827" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text x="72" y="222" text-anchor="middle" class="actor">管理员</text>
    <text x="72" y="252" text-anchor="middle" class="actorSub">低频使用：维护 / 检查</text>
  </g>

  <g transform="translate(1268 710)">
    <rect x="0" y="0" width="170" height="74" rx="10" fill="#f4f7fb" stroke="#111827" stroke-width="2.2"/>
    <text x="85" y="31" text-anchor="middle" class="actor">外部 AI 服务</text>
    <text x="85" y="57" text-anchor="middle" class="actorSub">按需调用</text>
  </g>

  <g>
    <ellipse cx="505" cy="255" rx="140" ry="39" class="caseOval"/>
