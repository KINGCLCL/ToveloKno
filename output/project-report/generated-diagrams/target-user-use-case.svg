    <ellipse cx="1042" cy="495" rx="126" ry="39" class="caseOvalGreen"/>
    <text x="1042" y="502" text-anchor="middle" class="case">资源分享 / 收藏</text>

    <ellipse cx="505" cy="615" rx="126" ry="39" class="caseOvalGreen"/>
    <text x="505" y="622" text-anchor="middle" class="case">论坛发帖 / 回复</text>

    <ellipse cx="782" cy="615" rx="152" ry="39" class="caseOvalPink"/>
    <text x="782" y="622" text-anchor="middle" class="case">AI 辅助分析与生成建议</text>

    <ellipse cx="1042" cy="615" rx="124" ry="39" class="caseOvalAlt"/>
    <text x="1042" y="622" text-anchor="middle" class="case">用户与数据管理</text>

    <ellipse cx="782" cy="735" rx="142" ry="39" class="caseOvalAlt"/>
    <text x="782" y="742" text-anchor="middle" class="case">操作日志 / 系统统计</text>
  </g>

