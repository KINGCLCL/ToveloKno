server.port=8080

# Force UTF-8 for HTTP requests and responses, especially Chinese messages in JSON.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.datasource.url=${TOVELOKNO_DB_URL:jdbc:mysql://localhost:3306/tovelokno_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${TOVELOKNO_DB_USERNAME:root}
spring.datasource.password=${TOVELOKNO_DB_PASSWORD:000000}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false

app.auth.token-secret=${TOVELOKNO_TOKEN_SECRET:tovelokno-dev-secret-change-before-deploy}
app.auth.token-expiration-hours=${TOVELOKNO_TOKEN_EXPIRATION_HOURS:24}
app.cors.allowed-origins=${TOVELOKNO_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.upload.profile-dir=${TOVELOKNO_PROFILE_UPLOAD_DIR:uploads/profile}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
